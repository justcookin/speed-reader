<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speed Reader</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <span class="icon">⚡</span>
  <h1>Speed Reader</h1>
</header>

<main>

  <!-- Drop zone -->
  <div id="drop-zone" role="button" tabindex="0" aria-label="Upload file">
    <span class="drop-icon">📄</span>
    <p>Drop a file here, or click to choose</p>
    <p class="hint">Supported: PDF, PPTX, TXT</p>
    <input type="file" id="file-input" accept=".pdf,application/pdf,.pptx,application/vnd.openxmlformats-officedocument.presentationml.presentation,.txt,text/plain" />
  </div>

  <!-- Loading indicator -->
  <div id="loading" aria-live="polite">
    <div class="spinner"></div>
    <span>Extracting text…</span>
  </div>

  <!-- File info -->
  <div id="file-info" role="status">
    <span class="file-icon">📎</span>
    <span id="file-name"></span>
    <span id="word-count"></span>
  </div>

  <!-- Mode toggle -->
  <div id="mode-toggle">
    <button id="btn-rsvp" class="mode-btn active" disabled>RSVP</button>
    <button id="btn-guide" class="mode-btn" disabled>Guide</button>
  </div>

  <!-- Reader display -->
  <div id="reader" aria-live="off">
    <span id="reader-placeholder">Upload a file to begin</span>
    <div id="word-display" aria-label="current word" style="display:none;">
      <span id="word-prefix"></span><span id="word-orp"></span><span id="word-suffix"></span>
    </div>
    <div id="guide-text"></div>
  </div>

  <!-- Controls -->
  <div id="controls">
    <button id="btn-slower" title="Decrease speed (−10 WPM)">◀ −10</button>
    <button id="btn-play" disabled>▶ Start</button>
    <button id="btn-faster" title="Increase speed (+10 WPM)">+10 ▶</button>
    <span id="wpm-display">300 WPM</span>
  </div>

  <!-- Chunk controls (Guide mode only) -->
  <div id="chunk-controls">
    <button id="btn-chunk-less">− Chunk</button>
    <span id="chunk-display">3 words</span>
    <button id="btn-chunk-more">+ Chunk</button>
  </div>

  <!-- Progress -->
  <div id="progress-section">
    <div id="progress-bar-track">
      <div id="progress-bar-fill"></div>
    </div>
    <div id="progress-label">— / —</div>
  </div>

  <div id="kb-hint"><kbd>Space</kbd> to play / pause</div>

</main>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<!-- JSZip (for .pptx) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function () {
  'use strict';

  // ── State ────────────────────────────────────────────────────────────────
  let words        = [];   // flat word list (drives RSVP + word count)
  let blocks       = [];   // structured blocks {type, words, startIndex} (drives Guide)
  let currentIndex = 0;
  let wpm          = 300;
  let intervalId   = null;
  let mode         = 'rsvp';  // 'rsvp' | 'guide'
  let chunkSize    = 3;
  const MIN_WPM    = 60;
  const MAX_WPM    = 1000;
  const MIN_CHUNK  = 1;
  const MAX_CHUNK  = 10;

  // ── DOM refs ─────────────────────────────────────────────────────────────
  const dropZone      = document.getElementById('drop-zone');
  const fileInput     = document.getElementById('file-input');
  const loading       = document.getElementById('loading');
  const fileInfo      = document.getElementById('file-info');
  const fileNameEl    = document.getElementById('file-name');
  const wordCountEl   = document.getElementById('word-count');
  const readerEl      = document.getElementById('reader');
  const placeholder   = document.getElementById('reader-placeholder');
  const wordDisplay   = document.getElementById('word-display');
  const wordPrefix    = document.getElementById('word-prefix');
  const wordOrp       = document.getElementById('word-orp');
  const wordSuffix    = document.getElementById('word-suffix');
  const guideTextEl   = document.getElementById('guide-text');
  const btnPlay       = document.getElementById('btn-play');
  const btnSlower     = document.getElementById('btn-slower');
  const btnFaster     = document.getElementById('btn-faster');
  const wpmDisplay    = document.getElementById('wpm-display');
  const progressFill  = document.getElementById('progress-bar-fill');
  const progressLabel = document.getElementById('progress-label');
  const btnRsvp       = document.getElementById('btn-rsvp');
  const btnGuide      = document.getElementById('btn-guide');
  const chunkControls = document.getElementById('chunk-controls');
  const chunkDisplay  = document.getElementById('chunk-display');
  const btnChunkLess  = document.getElementById('btn-chunk-less');
  const btnChunkMore  = document.getElementById('btn-chunk-more');

  // ── PDF.js setup ─────────────────────────────────────────────────────────
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  // ── ORP calculation ───────────────────────────────────────────────────────
  function orpIndex(word) {
    return Math.ceil(word.length / 2) - 1;
  }

  function renderWord(word) {
    if (!word) return;
    const pivot = orpIndex(word);
    wordPrefix.textContent = word.slice(0, pivot);
    wordOrp.textContent    = word[pivot];
    wordSuffix.textContent = word.slice(pivot + 1);
  }

  // ── Guide text rendering ──────────────────────────────────────────────────
  function renderGuideText() {
    guideTextEl.innerHTML = blocks.map(block => {
      if (!block.words.length) return '';
      const inner = block.words
        .map((w, j) => `<span data-i="${block.startIndex + j}">${w} </span>`)
        .join('');
      switch (block.type) {
        case 'heading':
          return `<div class="guide-heading">${inner}</div>`;
        case 'bullet':
          return `<div class="guide-bullet"><span class="bullet-marker" aria-hidden="true">•</span><span class="bullet-body">${inner}</span></div>`;
        default:
          return `<p class="guide-para">${inner}</p>`;
      }
    }).join('');
  }

  function highlightChunk(startIndex) {
    guideTextEl.querySelectorAll('.active-chunk')
      .forEach(el => el.classList.remove('active-chunk'));
    for (let i = startIndex; i < Math.min(startIndex + chunkSize, words.length); i++) {
      const span = guideTextEl.querySelector(`[data-i="${i}"]`);
      if (span) span.classList.add('active-chunk');
    }
    // Paging: only snap when the chunk moves past the bottom of the visible area
    const firstSpan = guideTextEl.querySelector(`[data-i="${startIndex}"]`);
    if (!firstSpan) return;
    const spanBottom = firstSpan.offsetTop + firstSpan.offsetHeight;
    const viewBottom = readerEl.scrollTop + readerEl.clientHeight;
    if (spanBottom > viewBottom) {
      readerEl.scrollTop = firstSpan.offsetTop - 20;
    }
  }

  // ── Interval timing ───────────────────────────────────────────────────────
  function intervalMs() {
    return mode === 'rsvp'
      ? 60000 / wpm
      : (chunkSize * 60000) / wpm;
  }

  // ── Tick ──────────────────────────────────────────────────────────────────
  function tick() {
    if (currentIndex >= words.length) {
      stop();
      return;
    }
    if (mode === 'rsvp') {
      renderWord(words[currentIndex]);
      currentIndex++;
    } else {
      highlightChunk(currentIndex);
      currentIndex += chunkSize;
    }
    updateProgress();
  }

  function start() {
    if (!words.length) return;
    if (currentIndex >= words.length) {
      currentIndex = 0;
    }
    intervalId = setInterval(tick, intervalMs());
    btnPlay.textContent = '⏸ Pause';
    btnPlay.classList.add('playing');
  }

  function stop() {
    clearInterval(intervalId);
    intervalId = null;
    btnPlay.textContent = '▶ Resume';
    btnPlay.classList.remove('playing');
    if (currentIndex >= words.length) {
      btnPlay.textContent = '↺ Restart';
    }
  }

  function togglePlay() {
    if (intervalId) {
      stop();
    } else {
      start();
    }
  }

  // ── Progress ──────────────────────────────────────────────────────────────
  function updateProgress() {
    if (!words.length) return;
    const pct = (currentIndex / words.length) * 100;
    progressFill.style.width = pct + '%';
    progressLabel.textContent =
      `${currentIndex.toLocaleString()} / ${words.length.toLocaleString()}`;
  }

  function resetProgress() {
    progressFill.style.width = '0%';
    progressLabel.textContent = '0 / ' + words.length.toLocaleString();
  }

  // ── WPM controls ─────────────────────────────────────────────────────────
  function setWpm(newWpm) {
    wpm = Math.min(MAX_WPM, Math.max(MIN_WPM, newWpm));
    wpmDisplay.textContent = wpm + ' WPM';
    if (intervalId) {
      clearInterval(intervalId);
      intervalId = setInterval(tick, intervalMs());
    }
  }

  btnSlower.addEventListener('click', () => setWpm(wpm - 10));
  btnFaster.addEventListener('click', () => setWpm(wpm + 10));

  // ── Chunk controls ────────────────────────────────────────────────────────
  function setChunkSize(n) {
    chunkSize = Math.min(MAX_CHUNK, Math.max(MIN_CHUNK, n));
    chunkDisplay.textContent = chunkSize + ' word' + (chunkSize === 1 ? '' : 's');
    if (intervalId) {
      clearInterval(intervalId);
      intervalId = setInterval(tick, intervalMs());
    }
  }

  btnChunkLess.addEventListener('click', () => setChunkSize(chunkSize - 1));
  btnChunkMore.addEventListener('click', () => setChunkSize(chunkSize + 1));

  // ── Mode switching ────────────────────────────────────────────────────────
  function switchMode(newMode) {
    if (newMode === mode) return;
    stop();
    mode = newMode;
    btnRsvp.classList.toggle('active', mode === 'rsvp');
    btnGuide.classList.toggle('active', mode === 'guide');
    wordDisplay.style.display   = mode === 'rsvp'  ? 'flex'  : 'none';
    guideTextEl.style.display   = mode === 'guide' ? 'block' : 'none';
    chunkControls.style.display = mode === 'guide' ? 'flex'  : 'none';
    readerEl.classList.toggle('guide-mode', mode === 'guide');
    if (words.length) {
      currentIndex = 0;
      resetProgress();
      if (mode === 'guide') highlightChunk(0);
      else renderWord(words[0]);
      btnPlay.textContent = '▶ Start';
      btnPlay.classList.remove('playing');
    }
  }

  btnRsvp.addEventListener('click', () => switchMode('rsvp'));
  btnGuide.addEventListener('click', () => switchMode('guide'));

  // ── Play button ───────────────────────────────────────────────────────────
  btnPlay.addEventListener('click', togglePlay);

  // ── Space bar shortcut ────────────────────────────────────────────────────
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && e.target === document.body) {
      e.preventDefault();
      if (words.length) togglePlay();
    }
  });

  // ── Text tokeniser ────────────────────────────────────────────────────────
  function tokenise(text) {
    return text.split(/\s+/).filter(w => w.length > 0);
  }

  // ── Block helpers ─────────────────────────────────────────────────────────
  // Given a raw array of {type, text} blocks, assign sequential word indices
  // and return the flat words array.
  function processBlocks(rawBlocks) {
    const flat = [];
    for (const block of rawBlocks) {
      block.startIndex = flat.length;
      block.words = tokenise(block.text);
      flat.push(...block.words);
    }
    return flat;
  }

  // ── PDF extraction ────────────────────────────────────────────────────────
  // Groups PDF text items into visual lines, then into paragraph/heading/bullet
  // blocks using gap size and font-size heuristics.
  function pdfItemsToBlocks(items) {
    const BULLET_RE = /^[\u2022\u2023\u25E6\u25AA\u25CF\u25CB\u2043•·▪▸◦]\s*|^[-*]\s+/;
    const nonEmpty  = items.filter(item => item.str.trim());
    if (!nonEmpty.length) return [];

    // Group items into lines using y-coordinate proximity (±2 units)
    const lines = [];
    for (const item of nonEmpty) {
      const y  = item.transform[5];
      const fs = item.height || Math.abs(item.transform[3]) || 0;
      const x  = item.transform[4];
      const existing = lines.find(l => Math.abs(l.y - y) <= 2);
      if (existing) {
        existing.text += item.str;
        if (fs > existing.maxFS) existing.maxFS = fs;
        if (x  < existing.minX)  existing.minX  = x;
      } else {
        lines.push({ y, text: item.str, maxFS: fs, minX: x });
      }
    }

    // Sort top-to-bottom (PDF y=0 is bottom, so descending y = reading order)
    lines.sort((a, b) => b.y - a.y);
    const cleanLines = lines.map(l => ({ ...l, text: l.text.trim() })).filter(l => l.text);
    if (!cleanLines.length) return [];

    // Compute median line gap → paragraph break threshold
    const gaps = [];
    for (let i = 1; i < cleanLines.length; i++) {
      const g = cleanLines[i - 1].y - cleanLines[i].y;
      if (g > 0) gaps.push(g);
    }
    gaps.sort((a, b) => a - b);
    const medianGap     = gaps[Math.floor(gaps.length / 2)] || 12;
    const paraThreshold = medianGap * 1.8;

    // Compute median font size → heading detection threshold
    const fontSizes = cleanLines.map(l => l.maxFS).filter(f => f > 0).sort((a, b) => a - b);
    const medianFS  = fontSizes[Math.floor(fontSizes.length / 2)] || 12;

    // Build blocks
    const rawBlocks = [];
    let cur = null;
    for (let i = 0; i < cleanLines.length; i++) {
      const line        = cleanLines[i];
      const gap         = i > 0 ? cleanLines[i - 1].y - line.y : 0;
      const isNewBlock  = !cur || gap > paraThreshold;
      const isHeading   = line.maxFS > medianFS * 1.2;
      const bulletMatch = line.text.match(BULLET_RE);
      const isBullet    = !!bulletMatch;
      const text        = isBullet ? line.text.slice(bulletMatch[0].length).trim() : line.text;
      const type        = isHeading ? 'heading' : isBullet ? 'bullet' : 'paragraph';

      if (isNewBlock || isHeading || isBullet) {
        cur = { type, text };
        rawBlocks.push(cur);
      } else {
        cur.text += ' ' + text;
      }
    }

    return rawBlocks.filter(b => b.text.trim());
  }

  async function extractFromPdf(arrayBuffer) {
    const pdf   = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    const rawBlocks = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const page    = await pdf.getPage(i);
      const content = await page.getTextContent();
      rawBlocks.push(...pdfItemsToBlocks(content.items));
    }
    return rawBlocks;
  }

  // ── PPTX extraction ───────────────────────────────────────────────────────
  // Title placeholder shapes → heading blocks; body shapes → paragraph blocks.
  async function extractFromPptx(arrayBuffer) {
    const zip = await JSZip.loadAsync(arrayBuffer);
    const slideFiles = Object.keys(zip.files)
      .filter(name => /^ppt\/slides\/slide\d+\.xml$/.test(name))
      .sort((a, b) => {
        const n = s => parseInt(s.match(/\d+/)[0]);
        return n(a) - n(b);
      });

    if (!slideFiles.length) throw new Error('No slides found in this PPTX file.');

    const parser  = new DOMParser();
    const DML     = 'http://schemas.openxmlformats.org/drawingml/2006/main';
    const PML     = 'http://schemas.openxmlformats.org/presentationml/2006/main';
    const rawBlocks = [];

    for (const name of slideFiles) {
      const xml  = await zip.files[name].async('string');
      const doc  = parser.parseFromString(xml, 'application/xml');
      const shapes = doc.getElementsByTagNameNS(PML, 'sp');

      for (const sp of shapes) {
        const ph     = sp.getElementsByTagNameNS(PML, 'ph')[0];
        const phType = ph ? ph.getAttribute('type') : null;
        const isTitle = phType === 'title' || phType === 'ctrTitle';

        const tNodes = sp.getElementsByTagNameNS(DML, 't');
        const text   = Array.from(tNodes)
          .map(t => t.textContent.trim())
          .filter(Boolean)
          .join(' ');
        if (text) rawBlocks.push({ type: isTitle ? 'heading' : 'paragraph', text });
      }
    }

    return rawBlocks;
  }

  // ── TXT extraction ────────────────────────────────────────────────────────
  // Blank lines → paragraph breaks; lines starting with bullet chars → bullets.
  function txtToBlocks(text) {
    const BULLET_RE = /^[\u2022•·▪▸◦*-]\s+/;
    const rawBlocks = [];

    for (const para of text.split(/\n{2,}/)) {
      const trimmed = para.trim();
      if (!trimmed) continue;

      const lines = trimmed.split('\n').map(l => l.trim()).filter(Boolean);

      // If every line starts with a bullet marker, treat each as a bullet
      if (lines.length > 1 && lines.every(l => BULLET_RE.test(l))) {
        for (const line of lines) {
          const m = line.match(BULLET_RE);
          rawBlocks.push({ type: 'bullet', text: line.slice(m[0].length).trim() });
        }
      } else if (lines.length === 1 && BULLET_RE.test(lines[0])) {
        const m = lines[0].match(BULLET_RE);
        rawBlocks.push({ type: 'bullet', text: lines[0].slice(m[0].length).trim() });
      } else {
        rawBlocks.push({ type: 'paragraph', text: lines.join(' ') });
      }
    }

    return rawBlocks.length ? rawBlocks : [{ type: 'paragraph', text: text.trim() }];
  }

  async function extractFromTxt(file) {
    return txtToBlocks(await file.text());
  }

  // ── File dispatcher ───────────────────────────────────────────────────────
  function fileType(file) {
    const name = file.name.toLowerCase();
    if (name.endsWith('.pdf'))  return 'pdf';
    if (name.endsWith('.pptx')) return 'pptx';
    if (name.endsWith('.txt'))  return 'txt';
    return null;
  }

  async function handleFile(file) {
    const type = fileType(file);
    if (!type) {
      alert('Unsupported file type. Please upload a PDF, PPTX, or TXT file.');
      return;
    }

    stop();
    dropZone.style.display = 'none';
    fileInfo.style.display = 'none';
    loading.style.display  = 'flex';

    try {
      let rawBlocks;
      if (type === 'pdf') {
        rawBlocks = await extractFromPdf(await file.arrayBuffer());
      } else if (type === 'pptx') {
        rawBlocks = await extractFromPptx(await file.arrayBuffer());
      } else {
        rawBlocks = await extractFromTxt(file);
      }

      if (!rawBlocks.length) {
        const hint = type === 'pdf' ? ' It may be a scanned image PDF.' : '';
        throw new Error('No text found in this file.' + hint);
      }

      blocks       = rawBlocks;
      words        = processBlocks(blocks);   // assigns startIndex + .words on each block
      currentIndex = 0;

      if (!words.length) {
        throw new Error('No readable words found in this file.');
      }

      fileNameEl.textContent  = file.name;
      wordCountEl.textContent = words.length.toLocaleString() + ' words';
      fileInfo.style.display  = 'flex';

      renderGuideText();

      placeholder.style.display = 'none';
      if (mode === 'rsvp') {
        wordDisplay.style.display = 'flex';
        guideTextEl.style.display = 'none';
        renderWord(words[0]);
      } else {
        wordDisplay.style.display = 'none';
        guideTextEl.style.display = 'block';
        readerEl.scrollTop = 0;
        highlightChunk(0);
      }
      resetProgress();

      btnPlay.disabled    = false;
      btnPlay.textContent = '▶ Start';
      btnPlay.classList.remove('playing');
      btnRsvp.disabled = false;
      btnGuide.disabled = false;

    } catch (err) {
      alert('Error reading file: ' + err.message);
      dropZone.style.display = 'flex';
    } finally {
      loading.style.display = 'none';
    }
  }

  // ── Drop zone interactions ─────────────────────────────────────────────────
  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') fileInput.click();
  });

  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) handleFile(fileInput.files[0]);
    fileInput.value = '';
  });

  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('drag-over');
  });

  dropZone.addEventListener('dragleave', () => {
    dropZone.classList.remove('drag-over');
  });

  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file) handleFile(file);
  });

  fileInfo.addEventListener('click', () => fileInput.click());
  fileInfo.style.cursor = 'pointer';
  fileInfo.title = 'Click to load a different file';

})();
</script>
</body>
</html>
